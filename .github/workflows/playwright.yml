name: Playwright

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

env:
  CI: true
  PLAYWRIGHT_HTML_OPEN: never

jobs:
  e2e:
    name: Build and e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Start local Supabase, migrate, and seed
        run: bun run setup

      - name: Build app
        run: bun run build

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright
        id: playwright
        run: bun run test:e2e

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload traces, screenshots, and videos
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Publish visual report to GitHub Pages
        id: pages
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: playwright-report
          destination_dir: playwright/${{ github.event.pull_request.number || github.run_id }}
          keep_files: true
          force_orphan: false
          commit_message: "Playwright report ${{ github.event.pull_request.number || github.run_id }}"

      - name: Ensure GitHub Pages site
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1 || \
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" \
              -f build_type=legacy \
              -f "source[branch]=gh-pages" \
              -f "source[path]=/"

      - name: Write job summary
        if: ${{ !cancelled() }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_URL: https://jakegoodmandev.github.io/fillthemat/playwright/${{ github.event.pull_request.number || github.run_id }}/
        run: |
          {
            echo "## Playwright"
            echo ""
            echo "Status: **${{ steps.playwright.outcome || job.status }}**"
            echo ""
            echo "Visual report (screenshots + traces in the browser):"
            echo ""
            echo "${REPORT_URL}"
            echo ""
            echo "Open a test, then **Screenshot** or **Trace** to see the UI."
            echo ""
            echo "Artifacts on this [workflow run](${RUN_URL}):"
            echo ""
            echo "- \`playwright-report\` — HTML report"
            echo "- \`playwright-test-results\` — traces, screenshots, videos"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment results on the PR
        if: github.event_name == 'pull_request' && !cancelled()
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_URL: https://jakegoodmandev.github.io/fillthemat/playwright/${{ github.event.pull_request.number }}/
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- playwright-pr-report -->";
            const passed = "${{ steps.playwright.outcome }}" === "success";
            const runUrl = process.env.RUN_URL;
            const reportUrl = process.env.REPORT_URL;

            const failed = [];
            try {
              const report = JSON.parse(
                fs.readFileSync("test-results/results.json", "utf8"),
              );
              const walk = (suite) => {
                for (const spec of suite.specs ?? []) {
                  if (spec.ok === false) {
                    failed.push(spec.title);
                  }
                }
                for (const child of suite.suites ?? []) walk(child);
              };
              for (const suite of report.suites ?? []) walk(suite);
            } catch {
              // Report is missing when the suite never started.
            }

            const lines = [
              marker,
              "## Playwright e2e",
              "",
              `**${passed ? "Passed" : "Failed"}** · [workflow run](${runUrl})`,
              "",
              `**Visual report:** ${reportUrl}`,
              "",
              "Click a test, then Screenshot or Trace to inspect the UI in the browser.",
              "No download needed.",
            ];
            if (failed.length > 0) {
              lines.push("", "Failed tests:", ...failed.map((title) => `- ${title}`));
            }
            const body = lines.join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
