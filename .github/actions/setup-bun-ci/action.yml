name: Setup Bun CI
description: Install Bun from package.json packageManager and frozen lockfile deps

runs:
  using: composite
  steps:
    - name: Read Bun version from packageManager
      id: pin
      shell: bash
      run: |
        version=$(jq -r '.packageManager | split("@")[1]' package.json)
        if [ -z "$version" ] || [ "$version" = "null" ]; then
          echo "package.json is missing packageManager (expected bun@x.y.z)" >&2
          exit 1
        fi
        echo "version=$version"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - uses: oven-sh/setup-bun@v2.2.0
      with:
        bun-version: ${{ steps.pin.outputs.version }}

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
